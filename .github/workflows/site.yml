name: Website

# Publishes the site/ folder (landing page and privacy policy) to GitHub
# Pages. One-time setup by the repository owner: Settings → Pages → Source:
# "GitHub Actions". Until then this workflow only leaves a note.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Ready to publish?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      go: ${{ steps.ready.outputs.go }}
    steps:
      - uses: actions/checkout@v5
      - id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -rq "TO-BE-ADDED" site; then
            echo "::notice title=Website not published::The privacy policy still has details to fill in (search site/ for TO-BE-ADDED)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif ! gh api "repos/$GITHUB_REPOSITORY/pages" --silent 2>/dev/null; then
            echo "::notice title=Website not published::GitHub Pages is not switched on yet. Repository Settings → Pages → Source: GitHub Actions, then run this workflow again."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Publish website
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir -p _site/fonts
          cp -r site/. _site/
          # The app's own fonts (SIL Open Font License), so the site needs
          # nothing from other servers.
          cp assets/fonts/Poppins_600SemiBold.ttf assets/fonts/Inter_400Regular.ttf \
             assets/fonts/Inter_600SemiBold.ttf assets/fonts/Poppins-OFL.txt \
             assets/fonts/Inter-OFL.txt _site/fonts/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
