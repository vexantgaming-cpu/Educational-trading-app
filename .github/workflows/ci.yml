name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Tests & analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Simulation engine tests
        working-directory: packages/market_sim
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Simulation engine tests compiled to JavaScript (web = phone)
        working-directory: packages/market_sim
        run: dart test -p chrome
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Test APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      # Release build signed with the debug key: installable on a phone for
      # testing. The Play Store file is the "bundle" job below.
      - run: flutter build apk --release
      # The privacy policy and the Play "Data safety" form say the app cannot
      # send anything anywhere. Hold the build to that.
      - name: The app must not ask for internet access
        run: |
          manifests=$(find build/app/intermediates -name AndroidManifest.xml -path '*merged_manifest*' -path '*elease*' || true)
          if [ -z "$manifests" ]; then
            echo "::warning::Could not find the merged manifest to check permissions."
            exit 0
          fi
          echo "$manifests"
          { grep -ho 'android.permission.[A-Z_]*' $manifests || true; } | sort -u
          if grep -q 'android.permission.INTERNET' $manifests; then
            echo "::error::The release build asks for INTERNET. Update site/privacy and docs/play-store/console-answers.md first, then remove this check."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: upwiq-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  bundle:
    name: Play Store bundle
    needs: test
    # Only main is released, and only main may use the upload key.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # The upload key lives in two repository secrets, never in the
      # repository. See docs/play-store/README.md.
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' && secrets.UPLOAD_KEYSTORE_PASSWORD != '' }}
    steps:
      - name: Upload key not added yet
        if: env.HAS_UPLOAD_KEY != 'true'
        run: echo "::notice title=No Play bundle::Add the UPLOAD_KEYSTORE_BASE64 and UPLOAD_KEYSTORE_PASSWORD secrets (docs/play-store/README.md, step 2) and this job will build the file for Google Play."
      - uses: actions/checkout@v5
        if: env.HAS_UPLOAD_KEY == 'true'
      - uses: actions/setup-java@v5
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Unpack the upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          # Kept outside the checkout so it can never end up in an artifact.
          # Stray spaces or line breaks from copy and paste are removed.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 --decode > "$RUNNER_TEMP/upload-key.p12"; then
            echo "::error title=Upload key unreadable::The UPLOAD_KEYSTORE_BASE64 secret is not complete. Paste the whole line again (docs/play-store/README.md, step 2)."
            exit 1
          fi
          {
            echo "storeFile=$RUNNER_TEMP/upload-key.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties
      # Google Play needs a higher version code for every upload: the number
      # of this CI run. (Renaming this workflow file would restart the count.)
      - name: Build the app bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Check it is signed with the upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        run: |
          expected=$(tr -d ' \n\r' < docs/play-store/upload-key-sha256.txt)
          certificate=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab || true)
          actual=$(printf '%s\n' "$certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | sed -n '1p' | tr -d ' \n\r')
          echo "Signed with: ${actual:-nothing}"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Not signed with the upload key::Expected $expected. Check the two UPLOAD_KEYSTORE secrets (docs/play-store/README.md)."
            exit 1
          fi
          echo "### Play Store bundle ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Version code **${{ github.run_number }}**, signed with the upload key. Download **upwiq-play-bundle** below and upload \`app-release.aab\` to Play Console." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the upload key
        if: always() && env.HAS_UPLOAD_KEY == 'true'
        run: rm -f "$RUNNER_TEMP/upload-key.p12" android/key.properties
      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: upwiq-play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
